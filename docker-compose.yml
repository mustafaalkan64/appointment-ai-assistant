services:
  postgres:
    image: postgres:16-alpine
    container_name: appointment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: appointment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appointment_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - appointment-net

  redis:
    image: redis:7-alpine
    container_name: appointment-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - appointment-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: appointment-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: appointment_guest
      RABBITMQ_DEFAULT_PASS: appointment_guest_secret
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appointment-net

  appointment-api:
    build:
      context: .
      dockerfile: src/AppointmentBooking.Api/Dockerfile
    container_name: appointment-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=appointment_db;Username=postgres;Password=postgrespassword"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__RabbitMQ: "amqp://appointment_guest:appointment_guest_secret@rabbitmq:5672/"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appointment-net

  appointment-mcp-server:
    build:
      context: .
      dockerfile: src/AppointmentBooking.McpServer/Dockerfile
    container_name: appointment-mcp-server
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=appointment_db;Username=postgres;Password=postgrespassword"
      ConnectionStrings__Redis: "redis:6379"
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appointment-net

  appointment-chat-api:
    build:
      context: .
      dockerfile: src/AppointmentBooking.ChatApi/Dockerfile
    container_name: appointment-chat-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=appointment_db;Username=postgres;Password=postgrespassword"
      ConnectionStrings__Redis: "redis:6379"
      McpServer__Endpoint: "http://appointment-mcp-server:8080"
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
      appointment-mcp-server:
        condition: service_started
    networks:
      - appointment-net

networks:
  appointment-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
